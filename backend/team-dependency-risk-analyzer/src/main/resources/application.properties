# ===========================================
# Application
# ===========================================
spring.application.name=team-dependency-risk-analyzer
server.port=${PORT:8080}

# ===========================================
# MySQL Database
# Uses local values if environment variables are not available
# ===========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/team_risk_analyzer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# JPA / Hibernate
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================================
# JWT
# Uses local secret if APP_JWT_SECRET is not available
# ===========================================
app.jwt.secret=${APP_JWT_SECRET:3f8d2a1b9c4e7f0a6d5e2b8c1a4f7e0d3b6c9a2e5f8b1d4a7c0e3f6b9d2a5c8}
app.jwt.expiration=86400000

# ===========================================
# Logging
# ===========================================
logging.level.com.riskanalyzer=DEBUG
logging.level.org.springframework.security=DEBUG